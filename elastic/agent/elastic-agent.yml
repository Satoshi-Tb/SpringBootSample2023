agent.monitoring.enabled: false

outputs:
  default:
    type: elasticsearch
    hosts:
      - http://elasticsearch:9200

inputs:
  - id: spring-app-access-logs
    type: filestream
    use_output: default
    data_stream.namespace: default
    streams:
      - id: spring-app-access-logs-stream
        data_stream.dataset: custom.spring_app
        paths:
          - /var/log/spring-app/access.log
        parsers:
          - ndjson:
              target: ""
              overwrite_keys: true
              add_error_key: true
