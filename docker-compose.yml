services:
  spring-app:
    container_name: spring-app
    image: spring-boot-sample-2023:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # DataSource
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.h2.Driver"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      SPRING_SQL_INIT_ENCODING: "UTF-8"
      SPRING_SQL_INIT_MODE: "ALWAYS"
      SPRING_SQL_INIT_SCHEMA_LOCATIONS: "classpath:schema.sql"
      SPRING_SQL_INIT_DATA_LOCATIONS: "classpath:data.sql"

      # H2DB
      SPRING_H2_CONSOLE_ENABLED: ${SPRING_H2_CONSOLE_ENABLED}

      # message
      SPRING_MESSAGES_BASENAME: "i18n/messages,i18n/ValidationMessages"

      # MyBatis
      MYBATIS_MAPPER_LOCATIONS: "classpath*:/mapper/h2/*.xml"
      MYBATIS_CONFIGURATION_MAP_UNDERSCORE_TO_CAMEL_CASE: "true"
      MYBATIS_TYPE_ALIASES_PACKAGE: "com.example.domain.user.model"

      # Log Level
      LOGGING_LEVEL_COM_EXAMPLE: ${LOGGING_LEVEL_COM_EXAMPLE}
    healthcheck:
      # /login は filter 観測対象外のため、ヘルスチェックでアクセスログを汚さない。
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8080/login || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - observability

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    ports:
      - "9200:9200"
    environment:
      discovery.type: ${ELASTIC_DISCOVERY_TYPE}
      xpack.security.enabled: ${ELASTIC_SECURITY_ENABLED}
      ES_JAVA_OPTS: ${ELASTIC_ES_JAVA_OPTS}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - observability

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.12.2
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: ${KIBANA_ELASTICSEARCH_HOSTS}
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:5601/api/status >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks:
      - observability

  elastic-agent:
    container_name: elastic-agent
    image: docker.elastic.co/beats/elastic-agent:8.12.2
    user: root
    environment:
      FLEET_ENROLL: ${ELASTIC_AGENT_FLEET_ENROLL}
    depends_on:
      elasticsearch:
        condition: service_healthy
      spring-app:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - elastic-agent-state:/usr/share/elastic-agent/state
    restart: unless-stopped
    networks:
      - observability

volumes:
  elasticsearch-data:
  elastic-agent-state:

networks:
  observability:
    name: spring-boot-elastic-observability
